[project]
name = "local-llm-benchmark"
version = "0.1.0"
description = "Local LLM cost reduction benchmark harness"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "claude-agent-sdk>=0.1",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "pylint>=3.0",
    "sentence-transformers>=3.0",
    "pytest>=8.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jsonschema>=4.20",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness", "tests", "tests.evaluators", "tests.mdap", "tests.tools", "analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"
