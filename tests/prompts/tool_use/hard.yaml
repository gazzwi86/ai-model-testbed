category: tool_use
tier: hard
name: "Agentic test debugging loop"
description: "Tests ability to execute an agentic debugging loop: read files, run tests, interpret results, identify bugs, and propose fixes using tool calls"
prompt: |
  You are a debugging agent. A test suite is failing and you must diagnose and fix the issue. You have access to the following tools. Demonstrate the exact sequence of tool calls you would make, showing your reasoning at each step.

  ## Available Tools

  ```json
  {
    "tools": [
      {
        "type": "function",
        "function": {
          "name": "read_file",
          "description": "Read the contents of a file",
          "parameters": {
            "type": "object",
            "properties": {
              "path": {
                "type": "string",
                "description": "Path to the file to read"
              },
              "start_line": {
                "type": "integer",
                "description": "Start reading from this line number (1-indexed). Omit to start from beginning."
              },
              "end_line": {
                "type": "integer",
                "description": "Stop reading at this line number (inclusive). Omit to read to end."
              }
            },
            "required": ["path"]
          }
        }
      },
      {
        "type": "function",
        "function": {
          "name": "list_directory",
          "description": "List files and directories at a given path",
          "parameters": {
            "type": "object",
            "properties": {
              "path": {
                "type": "string",
                "description": "Directory path to list"
              },
              "recursive": {
                "type": "boolean",
                "description": "Whether to list recursively",
                "default": false
              },
              "pattern": {
                "type": "string",
                "description": "Glob pattern to filter results (e.g., '*.py')"
              }
            },
            "required": ["path"]
          }
        }
      },
      {
        "type": "function",
        "function": {
          "name": "run_tests",
          "description": "Run the test suite or specific test files",
          "parameters": {
            "type": "object",
            "properties": {
              "test_path": {
                "type": "string",
                "description": "Path to test file or directory. Omit to run all tests."
              },
              "test_name": {
                "type": "string",
                "description": "Specific test function name to run (e.g., 'test_calculate_discount')"
              },
              "verbose": {
                "type": "boolean",
                "description": "Enable verbose output with full tracebacks",
                "default": false
              },
              "coverage": {
                "type": "boolean",
                "description": "Run with coverage reporting",
                "default": false
              }
            },
            "required": []
          }
        }
      },
      {
        "type": "function",
        "function": {
          "name": "search_code",
          "description": "Search for a pattern across the codebase",
          "parameters": {
            "type": "object",
            "properties": {
              "pattern": {
                "type": "string",
                "description": "Regex pattern to search for"
              },
              "path": {
                "type": "string",
                "description": "Directory to search in",
                "default": "."
              },
              "file_pattern": {
                "type": "string",
                "description": "Glob pattern for files to search (e.g., '*.py')"
              },
              "max_results": {
                "type": "integer",
                "description": "Maximum number of matches to return",
                "default": 20
              }
            },
            "required": ["pattern"]
          }
        }
      },
      {
        "type": "function",
        "function": {
          "name": "write_file",
          "description": "Write or overwrite a file with new contents",
          "parameters": {
            "type": "object",
            "properties": {
              "path": {
                "type": "string",
                "description": "Path to the file to write"
              },
              "content": {
                "type": "string",
                "description": "Complete file content to write"
              }
            },
            "required": ["path", "content"]
          }
        }
      },
      {
        "type": "function",
        "function": {
          "name": "edit_file",
          "description": "Make a targeted edit to a file by replacing specific text",
          "parameters": {
            "type": "object",
            "properties": {
              "path": {
                "type": "string",
                "description": "Path to the file to edit"
              },
              "old_text": {
                "type": "string",
                "description": "The exact text to find and replace"
              },
              "new_text": {
                "type": "string",
                "description": "The replacement text"
              }
            },
            "required": ["path", "old_text", "new_text"]
          }
        }
      }
    ]
  }
  ```

  ## Scenario

  You have been told: "The test suite for the `pricing` module is failing. 3 out of 8 tests are broken. It was working yesterday before someone pushed changes to the discount calculation logic."

  The project structure is:
  ```
  project/
    src/
      pricing/
        __init__.py
        calculator.py
        discounts.py
        models.py
    tests/
      test_pricing/
        test_calculator.py
        test_discounts.py
    requirements.txt
  ```

  ## Your Task

  Walk through the complete debugging workflow as an agent would execute it. For each iteration of the loop, provide:

  1. **Observation**: What you know so far
  2. **Hypothesis**: What you think might be wrong
  3. **Action**: The exact tool call (JSON format) you would make
  4. **Simulated result**: Write a realistic mock result for your tool call
  5. **Analysis**: What the result tells you

  Execute at least 6 tool calls across the following phases:
  - **Phase 1: Orientation** - Understand the codebase structure and run the failing tests
  - **Phase 2: Investigation** - Read relevant source files and test files, narrow down the bug
  - **Phase 3: Diagnosis** - Identify the specific bug(s) causing the 3 test failures
  - **Phase 4: Fix** - Apply the fix using edit_file
  - **Phase 5: Verification** - Re-run tests to confirm the fix works

  Your simulated results should tell a coherent story: the discount calculation was recently changed from percentage-based to a tiered system, but the implementation has an off-by-one error in the tier boundaries and doesn't handle the edge case where quantity equals exactly the tier threshold.

  Show the complete agentic loop with realistic tool calls, realistic outputs, and sound reasoning between each step.
temperature: 0.3
max_output_tokens: 4096
evaluation:
  type: "tool_use"
  criteria:
    - name: "correct_tool_selection"
      description: "Uses appropriate tools for each phase (list_directory/read_file for orientation, run_tests for testing, search_code for investigation, edit_file for fixing)"
      weight: 0.20
    - name: "logical_flow"
      description: "Each step logically follows from the previous. Does not make leaps without evidence. Hypotheses are updated based on results."
      weight: 0.25
    - name: "realistic_simulation"
      description: "Simulated tool outputs are realistic (proper Python tracebacks, plausible code, coherent bug story)"
      weight: 0.20
    - name: "bug_identification"
      description: "Correctly identifies the off-by-one error and edge case bug through systematic investigation, not guessing"
      weight: 0.20
    - name: "fix_correctness"
      description: "Proposed fix via edit_file correctly addresses the identified bugs. The edit uses proper old_text/new_text targeting."
      weight: 0.15
