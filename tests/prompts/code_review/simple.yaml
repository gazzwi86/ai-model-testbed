category: code_review
tier: simple
name: "Buggy script review (5 bugs)"
description: "Tests ability to identify 5 planted bugs in a short Python script: off-by-one, unclosed file, silent type coercion, missing return, index error"
prompt: |
  Review the following Python script. Identify all bugs, explain each one, and provide corrected code.

  ```python
  import sys

  def read_scores(filepath):
      """Read scores from a file, one integer per line."""
      scores = []
      f = open(filepath, 'r')
      for line in f:
          scores.append(line.strip())
      return scores

  def compute_statistics(scores):
      """Compute mean and highest score."""
      total = 0
      for i in range(1, len(scores)):
          total += scores[i]
      mean = total / len(scores)
      highest = max(scores)
      return mean

  def get_grade(score):
      """Return letter grade for a numeric score."""
      if score >= 90:
          grade = 'A'
      elif score >= 80:
          grade = 'B'
      elif score >= 70:
          grade = 'C'
      elif score >= 60:
          grade = 'D'
      else:
          grade = 'F'

  def main():
      filepath = sys.argv[1]
      scores = read_scores(filepath)
      mean, highest = compute_statistics(scores)
      print(f"Mean score: {mean:.1f}")
      print(f"Highest score: {highest}")
      for score in scores:
          print(f"  {score}: {get_grade(score)}")

  if __name__ == '__main__':
      main()
  ```

  For each bug found, provide:
  1. The line number(s) affected
  2. The type of bug (e.g., logic error, resource leak, type error)
  3. A clear explanation of why it is a bug
  4. The corrected code for that section
temperature: 0.3
max_output_tokens: 2048
evaluation:
  type: "bug_detection"
  checklist:
    - id: "bug_1_off_by_one"
      description: "Off-by-one error in compute_statistics: range(1, len(scores)) skips the first element (index 0). Should be range(len(scores)) or iterate directly."
      severity: "logic_error"
      line: 15
    - id: "bug_2_unclosed_file"
      description: "File handle 'f' in read_scores is never closed. Should use a 'with' statement or explicitly call f.close()."
      severity: "resource_leak"
      line: 7
    - id: "bug_3_type_coercion"
      description: "Scores are appended as strings (line.strip() returns str). They are never converted to int/float, causing silent type coercion bugs in arithmetic and comparisons."
      severity: "type_error"
      line: 9
    - id: "bug_4_missing_return"
      description: "get_grade() does not return the grade variable. The function implicitly returns None."
      severity: "logic_error"
      line: 30
    - id: "bug_5_unpack_error"
      description: "compute_statistics returns only 'mean' (a single value), but main() tries to unpack it as 'mean, highest = compute_statistics(scores)'. Also, 'highest' is computed but never returned."
      severity: "runtime_error"
      line: 18
  pass_threshold: 4
  max_false_positives: 3
