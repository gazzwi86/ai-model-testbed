category: code_review
tier: medium
name: "Module review (8 bugs)"
description: "Tests ability to identify 8 planted bugs across security, architecture, and reliability concerns in a 200-line Python module"
prompt: |
  Review the following Python module for bugs, security vulnerabilities, and design issues. Identify all problems, classify their severity, and provide corrected code.

  ```python
  import sqlite3
  import os
  import threading
  import time
  from http.server import HTTPServer, BaseHTTPRequestHandler
  import json
  import html

  DB_PASSWORD = "pr0duction_s3cret!"
  API_KEY = "sk-live-abc123def456ghi789"

  class UserManager:
      """Handles user CRUD, authentication, session management, and reporting."""

      def __init__(self):
          self.db = sqlite3.connect("users.db")
          self.db.execute("""
              CREATE TABLE IF NOT EXISTS users (
                  id INTEGER PRIMARY KEY,
                  username TEXT,
                  password TEXT,
                  email TEXT,
                  bio TEXT,
                  login_count INTEGER DEFAULT 0
              )
          """)
          self.sessions = {}
          self.report_cache = []
          self._lock = threading.Lock()

      def create_user(self, username, password, email, bio=""):
          query = f"INSERT INTO users (username, password, email, bio) VALUES ('{username}', '{password}', '{email}', '{bio}')"
          self.db.execute(query)
          self.db.commit()
          return True

      def authenticate(self, username, password):
          query = f"SELECT id, password FROM users WHERE username = '{username}'"
          cursor = self.db.execute(query)
          row = cursor.fetchone()
          if row and row[1] == password:
              session_id = os.urandom(16).hex()
              self.sessions[session_id] = {"user_id": row[0], "created": time.time()}
              return session_id
          return None

      def get_user_profile(self, user_id):
          cursor = self.db.execute(f"SELECT username, email, bio FROM users WHERE id = {user_id}")
          row = cursor.fetchone()
          return {"username": row[0], "email": row[1], "bio": row[2]}

      def update_bio(self, user_id, new_bio):
          self.db.execute(f"UPDATE users SET bio = '{new_bio}' WHERE id = {user_id}")
          self.db.commit()

      def delete_user(self, user_id):
          self.db.execute(f"DELETE FROM users WHERE id = {user_id}")
          self.db.commit()
          # Note: sessions for deleted user are not cleaned up

      def generate_report(self):
          """Generate a report of all users for admin dashboard."""
          cursor = self.db.execute("SELECT id, username, email, bio, login_count FROM users")
          rows = cursor.fetchall()
          for row in rows:
              self.report_cache.append({
                  "id": row[0],
                  "username": row[1],
                  "email": row[2],
                  "bio": row[3],
                  "login_count": row[4]
              })
          return self.report_cache

      def increment_login_count(self, user_id):
          cursor = self.db.execute(f"SELECT login_count FROM users WHERE id = {user_id}")
          row = cursor.fetchone()
          count = row[0]
          time.sleep(0.01)  # simulate some processing
          self.db.execute(f"UPDATE users SET login_count = {count + 1} WHERE id = {user_id}")
          self.db.commit()

      def search_users(self, query):
          cursor = self.db.execute(f"SELECT username, bio FROM users WHERE username LIKE '%{query}%'")
          return [{"username": r[0], "bio": r[1]} for r in cursor.fetchall()]

      def export_users_html(self, user_ids):
          """Export user profiles as HTML snippet for embedding in admin page."""
          html_parts = []
          for uid in user_ids:
              profile = self.get_user_profile(uid)
              html_parts.append(
                  f"<div class='user-card'>"
                  f"<h2>{profile['username']}</h2>"
                  f"<p>{profile['bio']}</p>"
                  f"<span>{profile['email']}</span>"
                  f"</div>"
              )
          return "\n".join(html_parts)

      def cleanup_sessions(self, max_age=3600):
          now = time.time()
          for sid, data in self.sessions.items():
              if now - data["created"] > max_age:
                  del self.sessions[sid]

      def get_stats(self):
          cursor = self.db.execute("SELECT COUNT(*), SUM(login_count) FROM users")
          row = cursor.fetchone()
          return {
              "total_users": row[0],
              "total_logins": row[1],
              "active_sessions": len(self.sessions),
              "cached_reports": len(self.report_cache)
          }

      def backup_db(self, path):
          data = open("users.db", "rb").read()
          f = open(path, "wb")
          f.write(data)
          return True

      def load_config(self, filepath):
          f = open(filepath, 'r')
          config = json.load(f)
          if "db_password" in config:
              global DB_PASSWORD
              DB_PASSWORD = config["db_password"]
          return config
  ```

  For each issue found, provide:
  1. The line number(s) affected
  2. Category: security, reliability, performance, design, or correctness
  3. Severity: critical, high, medium, low
  4. A clear explanation
  5. The corrected code
temperature: 0.3
max_output_tokens: 4096
evaluation:
  type: "bug_detection"
  checklist:
    - id: "bug_1_god_class"
      description: "UserManager is a God class handling CRUD, auth, sessions, reporting, HTML export, backup, and config. Should be split into separate concerns."
      severity: "design"
      category: "design"
    - id: "bug_2_sql_injection"
      description: "Multiple methods use f-string SQL queries (create_user, authenticate, get_user_profile, update_bio, delete_user, search_users, increment_login_count). All are vulnerable to SQL injection. Must use parameterized queries."
      severity: "critical"
      category: "security"
    - id: "bug_3_hardcoded_creds"
      description: "DB_PASSWORD and API_KEY are hardcoded as module-level constants. Must be loaded from environment variables or a secrets manager."
      severity: "critical"
      category: "security"
    - id: "bug_4_missing_validation"
      description: "No input validation on user-supplied data (username, email, bio, user_id). No length checks, format validation, or sanitization."
      severity: "high"
      category: "security"
    - id: "bug_5_no_error_handling_io"
      description: "backup_db and load_config open files without error handling (no try/except, no 'with' statement). FileNotFoundError, PermissionError, etc. will crash."
      severity: "high"
      category: "reliability"
    - id: "bug_6_race_condition"
      description: "increment_login_count reads count, sleeps, then writes count+1. Under concurrent access this is a classic TOCTOU race condition. The _lock is never used. Should use SQL UPDATE SET login_count = login_count + 1."
      severity: "high"
      category: "correctness"
    - id: "bug_7_memory_leak"
      description: "generate_report appends to self.report_cache without ever clearing it. Each call adds all users again, causing unbounded memory growth."
      severity: "medium"
      category: "performance"
    - id: "bug_8_xss"
      description: "export_users_html inserts user-supplied data (username, bio, email) into HTML without escaping. Enables stored XSS attacks. Must use html.escape()."
      severity: "critical"
      category: "security"
  pass_threshold: 6
  max_false_positives: 4
